name: thiercelieux
description: "Loups-Garous de Thiercelieux — application compagnon pour partie en local (pass-and-play)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management — simple et robuste pour une machine à états de partie
  provider: ^6.1.2

  # Persistance locale des statistiques joueurs (léger, pas besoin de SQL)
  shared_preferences: ^2.3.2

  # Typographie (thème "veillée nocturne")
  google_fonts: ^6.2.1

  # Identifiants uniques pour joueurs / parties
  uuid: ^4.4.2

  # Formatage de dates pour l'historique des stats
  intl: ^0.19.0

  # Micro-animations sobres pour les transitions de nuit/jour
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # NB : les fichiers listés ici doivent exister physiquement dans assets/
  # avant de lancer `flutter run` / `flutter build`, sinon Flutter échoue
  # au build. Voir assets/IMAGES_A_CREER.md pour la liste complète.
  # Tant que les images ne sont pas fournies, l'app fonctionne quand même
  # grâce à des Icon() de secours (voir widgets/role_image.dart).
  assets:
    - assets/images/roles/
    - assets/images/ui/
    - assets/images/camps/