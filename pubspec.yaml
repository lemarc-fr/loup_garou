name: thiercelieux
description: "Loups-Garous de Thiercelieux — application compagnon pour partie en local (pass-and-play)."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

# Pourquoi chaque package : voir README.md.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0

  # State management — simple et robuste pour une machine à états de partie
  provider: ^6.1.5+1

  # Persistance locale des statistiques joueurs (léger, pas besoin de SQL)
  shared_preferences: ^2.5.6

  # Typographie (thème "veillée nocturne")
  google_fonts: ^9.0.0

  # Identifiants uniques pour joueurs / parties
  uuid: ^4.6.0

  # Requis par le code de traduction généré (lib/l10n)
  intl: ^0.20.3

  # Son de la nuit : fichiers audio (voix, musique d'ambiance, bruitages)
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  # NB : les fichiers listés ici doivent exister physiquement dans assets/
  # avant de lancer `flutter run` / `flutter build`, sinon Flutter échoue
  # au build. Voir assets/IMAGES_A_CREER.md pour la liste complète.
  # Tant que les images ne sont pas fournies, l'app fonctionne quand même
  # grâce à des Icon() de secours (voir widgets/role_image.dart).
  assets:
    - assets/images/roles/
    - assets/images/wolf_howling.svg
    # Son de la nuit (voir tool/audio/README.md). Chaque phrase doit avoir
    # son fichier dans chaque langue (vérifié par
    # test/services/voice_assets_test.dart) ; sans fichier, la musique et
    # les bruitages sont simplement absents.
    - assets/audio/voice/fr/
    - assets/audio/voice/en/
    - assets/audio/music/
    - assets/audio/sfx/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true