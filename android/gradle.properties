org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Required with AGP 9+: the Flutter Gradle plugin on stable (3.47.x) still uses the old DSL.
# Remove once a stable Flutter release supports the new DSL.
android.newDsl=false
# flutter_tts (4.2.5) still applies the classic Kotlin plugin, so built-in Kotlin must stay off.
# Switch to true (and drop kotlin-android from app/build.gradle.kts) once all plugins have migrated.
android.builtInKotlin=false
