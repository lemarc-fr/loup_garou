org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Required with AGP 9+: the Flutter Gradle plugin on stable (3.47.x) still uses the old DSL.
# Remove once a stable Flutter release supports the new DSL.
android.newDsl=false
# AGP 9 compiles Kotlin itself. If a package's android/build.gradle applies "kotlin-android",
# the build fails: see README.md, "Android build settings".
android.builtInKotlin=true
